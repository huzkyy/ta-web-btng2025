<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>index 2</title>

    <style>
      .content {
        display: grid;
        grid-template-columns: repeat(3, 200px);
        border: 1px solid black;
        gap: 20px;
      }

      .content div {
        /* width: 100px; */
        height: 100px;
        color: white;
      }

      #blue {
        background-color: blue;
      }
      #red {
        background-color: red;
      }
      #green {
        background-color: green;
      }
      #brown {
        background-color: brown;
      }
      #purple {
        background-color: purple;
      }
      #yellow {
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <p>index 2</p>

    <div class="content">
      <div id="blue">box 1</div>
      <div id="red">box 2</div>
      <div id="green">box 3</div>
      <div id="brown">box 4</div>
      <div id="purple">box 5</div>
      <div id="yellow">box 6</div>

      <a href="ndex.html" target="_blank">tallwind</a>
